[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "price-panel"
version = "2.0.0"
description = "Ежедневный сбор цен маркетплейсов: discovery -> SKU panel -> парсинг -> PostgreSQL (история цен)"
requires-python = ">=3.11"
dependencies = [
    "playwright==1.63.0",
    "google-api-python-client==2.147.0",
    "google-auth==2.35.0",
    "google-auth-oauthlib==1.2.1",
    "python-dotenv==1.0.1",
    # config.yaml конвейера (discovery, panel, расписание).
    "PyYAML==6.0.2",
    # База часовых поясов для zoneinfo: на Windows и в slim-образах её нет.
    "tzdata==2025.2",
]

# Драйверы БД нужны только соответствующему бэкенду, поэтому вынесены сюда:
# запуск с STORAGE=csv не должен требовать ни psycopg2, ни clickhouse-connect.
#     pip install -e ".[postgres]"
#     pip install -e ".[dev]"
[project.optional-dependencies]
postgres = ["psycopg2-binary==2.9.9"]
clickhouse = ["clickhouse-connect==0.8.3"]
dev = [
    "pytest==8.3.3",
    "jinja2==3.1.6",
    "ruff==0.16.8",
    "pyright==1.1.414",
    # Правило зависимостей между слоями пакета: lint-imports (см. ниже).
    "import-linter==2.15",
]

# ozon-* - точки входа старого сценария (только Ozon), имена сохранены.
[project.scripts]
price-panel = "price_panel.__main__:main"
ozon-parse = "price_panel.marketplaces.ozon.parse:main"
ozon-login = "price_panel.marketplaces.ozon.login:main"
ozon-check = "price_panel.legacy.check:main"

[tool.setuptools.packages.find]
include = ["price_panel*"]

[tool.setuptools.package-data]
# Миграции схемы применяются из пакета (price_panel.infra.warehouse.migrate).
"price_panel.infra" = ["migrations/*.sql"]

# Слои пакета (docs/architecture.md#слои): верхний слой может импортировать
# нижние, нижний верхние - нет. Проверка: lint-imports (и в CI).
[tool.importlinter]
root_package = "price_panel"

[[tool.importlinter.contracts]]
name = "Слои: app -> marketplaces -> infra -> core"
type = "layers"
layers = [
    "price_panel.app",
    "price_panel.marketplaces",
    "price_panel.infra",
    "price_panel.core",
]

[[tool.importlinter.contracts]]
name = "Старый сценарий - не опора для конвейера"
type = "forbidden"
source_modules = [
    "price_panel.core",
    "price_panel.infra",
    "price_panel.marketplaces",
    "price_panel.app",
]
forbidden_modules = ["price_panel.legacy"]
ignore_imports = [
    # Долг: парсер Ozon сам пишет CSV и таблицу старого сценария. Уходит, когда
    # цикл сбора переедет в ядро, а сохранение - в legacy (см. план, Phase 4b).
    "price_panel.marketplaces.ozon.parse -> price_panel.legacy.cli",
    "price_panel.marketplaces.ozon.parse -> price_panel.legacy.storage",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Короткая трассировка: в тестах-фикстурах длинная только мешает читать.
addopts = "-q --tb=short"

# Проверка типов: те же настройки подхватывает Pylance в VS Code.
[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
exclude = [".venv", "logs", "data", "**/__pycache__"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "logs", "data"]

[tool.ruff.lint]
# E/W - pycodestyle, F - pyflakes, I - сортировка импортов,
# B - типичные ловушки (bugbear), BLE - голые except Exception,
# UP - устаревшие конструкции.
select = ["E", "W", "F", "I", "B", "BLE", "UP"]
ignore = [
    # Сообщения и шаблоны SQL собираются через .format() - единый стиль проекта.
    "UP032",
]

[tool.ruff.lint.per-file-ignores]
# Тесты намеренно лезут во внутренности модулей и подменяют sys.modules.
"tests/*" = ["BLE001"]
# Airflow DAG старого сценария исполняет Python самого Airflow, версия которого
# не обязана совпадать с проектной: синтаксис 3.11 туда не переносим.
"dags/*" = ["UP"]
