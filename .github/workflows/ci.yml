# Проверки на каждый PR и push в main: ruff (линтер и формат), pyright, слои
# пакета (lint-imports), все тесты.
#
# Тесты идут с настоящим PostgreSQL (сервис ниже) и браузером Playwright, так
# что проверки базы и сквозные эталоны (tests/golden) здесь не пропускаются.
# В сеть тесты не ходят: ответы Ozon подменяются заглушками.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Одноразовая база раннера, доступна только внутри задачи.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pricepanel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_DSN: postgresql://postgres@localhost:5432/pricepanel_test
      HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # .venv в корне - его ждёт [tool.pyright] в pyproject.toml.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,postgres,clickhouse]"
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Pyright
        run: .venv/bin/pyright

      - name: Import layers
        run: .venv/bin/lint-imports

      - name: Tests
        run: .venv/bin/pytest -rs
