# ============================================================================
#  Настройки конвейера: discovery -> sku_panel -> ежедневный парсинг.
#
#  Здесь нет секретов: DSN базы, cookies, режим браузера, паузы и повторы
#  парсера карточек задаются в .env (см. .env.example), как и раньше.
#  Путь к этому файлу можно переопределить переменной PIPELINE_CONFIG.
# ============================================================================

discovery:
  # Зерно генератора случайных чисел: при одинаковой выдаче Ozon случайная
  # часть panel воспроизводится. К зерну добавляется имя категории, поэтому
  # категории не влияют друг на друга.
  seed: "ozon-panel-2026-09"

  # Доля SKU из начала выдачи (top). Остальное (1 - top_ratio) - случайная
  # выборка из глубины выдачи (tail_random). Можно переопределить у категории.
  top_ratio: 0.4

  # Пауза между запросами к листингу, секунды (от конца предыдущего запроса),
  # и её случайный разброс: 0.3 -> от 3.5 до 6.5 с. Не занижайте: при запросе
  # раз в 2 с Ozon после ~110 запросов начал отвечать HTTP 403 на всё
  # (прогон 29.09.2026). discovery запускается редко, спешить ему некуда.
  request_delay: 5.0
  request_jitter: 0.3

  # Если Ozon всё же ограничил запросы (HTTP 403/429, антибот-заглушка),
  # discovery ждёт по этому списку, секунды, заново открывая категорию. Не
  # помогло - сохраняет найденное и останавливается; следующий discover
  # доберёт недостающее.
  block_backoff: [10, 60, 180, 300]

  # Пауза между категориями, секунды.
  category_pause: 60

  # Хвост берётся со случайных страниц в диапазоне [первая страница после
  # top .. tail_max_page]. Ozon отдаёт по 8 товаров на страницу листинга и
  # обрывает выдачу на 646-684-й странице (~5200-5400 позиций) - замер
  # 29.09.2026 по всем четырём категориям ниже. 600 - с запасом внутри этой
  # глубины; если выдача окажется короче, discovery заметит пустые страницы
  # и сузит диапазон сам.
  tail_max_page: 600
  # Сколько товаров брать с одной случайной страницы хвоста: меньше - шире
  # охват глубины, но больше запросов. 3 -> 60 страниц на хвост из 180 SKU
  # вместо 90 при 2 (phone_cases 29.09.2026 собрана ещё с 2).
  tail_items_per_page: 3

  # Куда выгрузить SKU активной panel после discovery (формат - один столбец
  # sku). Файл годится и для старого сценария: python parse_ozon.py --file ...
  export_csv: data/panel_skus.csv

  # panel_size подобран по замеру скорости парсера (docs/performance.md,
  # «Размер panel»): 8.7 SKU/мин -> 4 x 300 = 1200 SKU за ~2.3 ч в сутки, около
  # трети 8-часового окна. Увеличение panel_size не перетасовывает panel:
  # discover доберёт недостающие SKU. Перед этим - python -m ozon_parser benchmark.
  categories:
    - name: phone_cases
      title: "Чехлы для телефонов"
      # Высокая конкуренция, низкая цена, много однотипных предложений.
      source: ozon_listing
      url: https://www.ozon.ru/category/chehly-dlya-telefonov-15892/
      panel_size: 300

    - name: smartphones
      title: "Смартфоны"
      # Высокая конкуренция, средняя и высокая цена, частые акции.
      source: ozon_listing
      url: https://www.ozon.ru/category/smartfony-15502/
      panel_size: 300

    - name: coffee_machines
      title: "Кофеварки и кофемашины"
      # Дорогие товары длительного пользования, редкие покупки.
      source: ozon_listing
      url: https://www.ozon.ru/category/kofevarki-i-kofemashiny-10530/
      panel_size: 300

    - name: string_accessories
      title: "Аксессуары для струнных инструментов"
      # Нишевая категория: мало продавцов, узкий спрос.
      source: ozon_listing
      url: https://www.ozon.ru/category/aksessuary-dlya-strunnyh-instrumentov-13993/
      panel_size: 300

    # Альтернативный источник - отчёт «Аналитика товаров» на data.ozon.ru
    # (нужна действующая сессия data.ozon.ru в cookies.json). Он отдаёт только
    # окно из 1000 товаров, отсортированных по метрике, поэтому «хвост» здесь -
    # это хвост топ-1000 по продажам, а не всей категории. См. docs/discovery.md.
    #
    # - name: smartphones_bestsellers
    #   title: "Смартфоны (data.ozon.ru)"
    #   source: data_ozon
    #   category_ids: ["95139"]      # id узла дерева data.ozon.ru («Смартфон»)
    #   sort_attribute: sum_gmv      # сумма заказов за 28 дней
    #   panel_size: 300

parser:
  # Экспорт результатов прогона panel в CSV - артефакт для глазной проверки.
  # Основное хранилище - PostgreSQL. Пусто - не выгружать.
  csv_export: data/panel_products.csv
  # Доля успешных SKU, ниже которой прогон завершается с кодом 1.
  min_success_rate: 0.8
  # Откуда брать цену, рейтинг и отзывы. html - из JSON, встроенного в HTML
  # карточки: страница открывается как и раньше, но без двух запросов к API и
  # без ожидания полной загрузки; если в HTML нет названия или цены, данные
  # берутся из API. api - из внутреннего API, как старый сценарий
  # parse_ozon.py. Темп от режима не зависит: карточки открываются не чаще
  # раза в PAGE_INTERVAL секунд (.env), так что html даёт меньше запросов к
  # API, но не больше страниц в минуту. Сейчас api - проверенный режим:
  # 07.10.2026 html без предела частоты (~14 карточек в минуту) получил капчу
  # на 14-й минуте, а api (~9 в минуту) с пустым cookies.json собрал 989 из
  # 989 SKU без капчи.
  price_source: api
  # Описание и полные характеристики (art_set, has_rich_content, цвет,
  # материал) почти не меняются, а это лишний запрос к Ozon на каждый товар.
  # Их запрашиваем у SKU, у которых их ещё нет, и раз в N дней у остальных -
  # каждый день у своей 1/N части panel. 1 - каждый день, 0 - только у новых.
  details_refresh_days: 7

schedule:
  # Время ежедневного запуска и часовой пояс. После изменения перезапустите
  # scripts/register_windows_task.ps1 - задача Windows перерегистрируется.
  # Прогон panel из 1200 SKU шёл ~2.3 ч (8.7 SKU/мин, режим api); в режиме
  # html benchmark 06.10.2026 - 15 SKU/мин, т.е. ~1 ч 20 мин. День наблюдения
  # в v_price_daily считается по Москве: прогон не должен переходить за
  # полночь, иначе его наблюдения разделятся на два дня.
  daily_at: "08:45"
  timezone: Europe/Moscow
  # Запустить прогон сразу при старте планировщика, не дожидаясь daily_at.
  run_on_start: false
  # Перед парсингом проверить сессию и при необходимости войти заново через
  # Gmail (get_cookies.py --non-interactive), как задача ensure_session в
  # Airflow. Выключено: карточки ozon.ru открываются без входа, а сохранённая
  # сессия всё равно не держится - парсер не сохраняет обновлённые токены, и
  # 06.10.2026 сессия от 25.09 при загрузке страницы оказалась гостевой.
  # Вход оставлен на будущее (например, для источника data_ozon).
  ensure_session: false
  session_max_age_days: 14
  # Жёсткий предел длительности ежедневного прогона вместе с повторами.
  # Совпадает с лимитом задачи Windows (scripts/register_windows_task.ps1).
  parse_timeout_hours: 10
  # Если Ozon остановил прогон капчей или отказами (статус blocked), через
  # block_retry_delay_hours часов прогон повторяется: только SKU, которых за
  # сегодня ещё нет. Не больше block_retries раз и только если до конца
  # parse_timeout_hours остаётся не меньше часа. 0 - не повторять.
  # 05.10.2026 капча остановила прогон на 348-м SKU, 01.10 - на 185-м.
  block_retries: 1
  block_retry_delay_hours: 3

backup:
  # Резервная копия базы после ежедневного прогона (и вручную:
  # python -m ozon_parser backup): pg_dump внутри контейнера postgres, формат
  # custom, восстанавливается pg_restore. Нужен запущенный Docker Desktop.
  enabled: true
  # Куда класть копии. Относительный путь - от корня проекта. Надёжнее другой
  # диск или папка, которая синхронизируется с облаком: в копии только данные
  # о товарах, секретов в ней нет.
  dir: backups
  # Сколько последних копий хранить (по одной за день).
  keep: 14

benchmark:
  # Сколько случайных SKU из panel парсить при замере скорости.
  sample_size: 50
  # Сколько часов в сутки отводится на парсинг и какая доля этого окна
  # закладывается в расчёт (запас на повторы и перезапуски браузера).
  window_hours: 8
  safety_factor: 0.8
